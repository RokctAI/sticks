name: auth_sdk
description: "auth_sdk - extracted from paas_customer (refork 2026-07-11)."
version: 1.16.7
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  app_tracking_transparency: ^2.0.6
  auto_route: ^9.2.0
  crypto: ^3.0.3
  # Direct dep: auth_repository.dart sends the idempotency-key header via
  # dio's Options (same version rail as base_sdk).
  dio: ^5.7.0
  drift: ^2.31.0
  firebase_auth: ^5.4.0
  firebase_dynamic_links: ^6.0.5
  firebase_messaging: ^15.1.0
  flutter_facebook_auth: ^7.0.0
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  freezed_annotation: ^3.1.0
  google_sign_in: ^6.2.1
  intl_phone_field: ^3.2.0
  permission_handler: ^11.3.1
  remixicon: ^1.4.1
  # Direct dep: restore_credential_service.dart caches the
  # has_synced_restore_credential marker. Same version rail as
  # base_sdk, whose LocalStorage keeps its SharedPreferences private.
  shared_preferences: ^2.5.2
  sign_in_with_apple: ^6.1.2
  sms_autofill: ^2.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.8.0

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../../../core/base/dart
  # base_sdk pins google_fonts 6.3.0, which fails const evaluation of its
  # FontWeight map on current Flutter (core PR #45 relaxes the pin for
  # hosts). Standalone-only: lets this package's tests compile; composed
  # apps resolve from their own root and never see this override.
  google_fonts: ^6.3.3
