name: users_sdk
description: "users_sdk - extracted from paas_customer (refork 2026-07-11)."
version: 1.5.1
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  # Test-only: user_repository_payload_test.dart drives PlatformGateway
  # through a recording HttpClientAdapter (same version rail as base_sdk).
  dio: ^5.7.0
  # ^3 to co-resolve with base_sdk's freezed_annotation ^3.1.0 (core repo);
  # the old ^2.5.7 pin made standalone `pub get` fail outright. This SDK's
  # lib has no freezed code of its own — only the profile template, whose
  # codegen runs in the composed host app.
  freezed: ^3.2.5
  json_serializable: ^6.8.0

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../../../core/base/dart
