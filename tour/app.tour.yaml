# Guided-tour manifest for the Sticks app shell.
#
# Brand wording lives here; the SDK fragments (auth_sdk and agent_sdk) stay
# brand-neutral and receive {app_name}/{app_tagline} by substitution at merge
# time. The merge, capture and assembly run in CI via RokctAI/shared-workflows
# universal-guided-tour.yml; format documentation is in that repo at
# scripts/tour/README.md.
app:
  name: Sticks
  tagline: AI employees that get the work done
video:
  hook: "Meet your team of AI employees."
  offer: "Hire your first Stick today."
  # Store canvas: the Sticks paper and ink from the approved render. Without
  # these the tour script falls back to the composed theme default (#FF6600).
  brand_color: "#F6F5F2"
  accent_color: "#1C1C1C"
setup:
  # Read by auth_sdk's demo_sign_in step. The demo login fixture accepts any
  # password and hands back this account.
  demo_email: customer@demo.rokct.ai
tour:
  # Splash settles onto the welcome screen.
  - step:
      key: welcome
      title: "Welcome to Sticks"
      caption: "{app_name} gives you a team of *AI employees* - sign in to meet them."
      action: wait
      settle: 12
  # auth_sdk captures the auth sheets, then signs in as the demo account.
  - fragment: auth
  # agent_sdk's Sticks screens: the team, one Stick, and one task run.
  - fragment: agent
